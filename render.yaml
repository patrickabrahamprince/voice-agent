services:
  - type: web
    name: mittal-palms-voice-agent
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: TELEPHONY_PROVIDER
        value: plivo
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: PLIVO_PHONE_NUMBER
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LEAD_EMAIL
        sync: false
      - key: ADMIN_SECRET_TOKEN
        sync: false
